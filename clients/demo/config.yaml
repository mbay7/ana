# Haven & Hearth — fictional UK homeware retailer (the demo/example client).
name: "Ana"
language: en

model:
  embed: all-MiniLM-L6-v2
  generate: deepseek/deepseek-chat   # cheap and returns content directly (v4-flash now reasoning-only)

retrieval:
  top_k: 4
  threshold: 0.32   # top-hit cosine below this -> abstain ("I don't know")
  hybrid: false

corpus_dir: corpus
persona_file: persona.txt
catalog_file: catalog.yaml
max_tokens: 250

ui:
  title: "Ana"
  subtitle: "Haven & Hearth's shopping assistant"
  emoji: "✨"
  placeholder: "Ask anything…"

# Where this assistant can be deployed. `web` is wired (Streamlit); whatsapp /
# instagram are connectors the client brings their own Meta keys for.
channels:
  - web
  - whatsapp
  - instagram