model:
  embed: all-MiniLM-L6-v2
  generate: anthropic/claude-sonnet-5

retrieval:
  top_k: 4
  threshold: 0.32   # top-hit cosine below this -> abstain ("I don't know")
  hybrid: false     # dense wins on this corpus (94% vs 88%); enable for exact-term-heavy corpora

corpus_dir: corpus
persona_file: personas/store.txt
max_tokens: 250

ui:
  title: "Store Assistant"
  subtitle: "ask about our products and policies"
  emoji: "🛍️"
  placeholder: "Ask anything…"